<!DOCTYPE html>
<html lang="en">

<head>
    <title>Columns</title>
    <meta charset="UTF-8">
    <meta name="author" content="Carles Rodríguez Font">
    <meta name="description" content="First 2D game project">
    <meta name="keywords" content="HTML, CSS, JS, game, tetris, columns, Sega, Megadrive">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="gameElements">

        <div class="canvasContainer">
            <canvas id="gameCanvas" width="300" height="700"></canvas>
        </div>

        <div class="inGameInfo">
            <div class="nextGemDisplay">
                <canvas id="uiCanvas" width="60" height="160"></canvas>
            </div>
            <div class="gameStatistics">
                <div id="scoringBackgroundSpace"></div>
                <div id="numberGemsBackgroundSpace"></div>
                <div id="difficultyBackgroundSpace"></div>
            </div>
        </div>

    </div>

    <button id="runButton">Start Game</button>

    <script src="logic.js"></script>
</body>

</html>
